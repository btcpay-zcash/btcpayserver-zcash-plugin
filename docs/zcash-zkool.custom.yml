services:
  zcash_walletd:
    restart: unless-stopped
    init: true
    image: hhanh00/zkool-graphql:6.37.0
    command:
      - --db-path
      - /data/zec-graphql.db
      - --coin
      - "0"
      - --lwd-url
      - https://zec.rocks:443
      - --bind-address
      - 0.0.0.0
      - --port
      - "8000"
      # Every client on the wallet network has full access in this mode.
      - --allow-unauthenticated
      - --allow-unencrypted-database
    environment:
      HOME: /data
      RUST_LOG: info
    expose:
      - "8000"
    volumes:
      - zec_graphql_wallet:/data

  btcpayserver:
    environment:
      BTCPAY_ZEC_WALLET_BACKEND_TYPE: ZkoolGraphQL
      BTCPAY_ZEC_WALLET_GRAPHQL_URI: http://zcash_walletd:8000/graphql

volumes:
  # A fresh receiving database keeps the legacy wallet volume available for recovery.
  zec_graphql_wallet:

exclusive:
  - zcash-node
